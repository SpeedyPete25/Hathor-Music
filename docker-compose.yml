services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POT_PROVIDER_BASE_URL: http://bgutil-provider:4416
    volumes:
      - ./data:/app/data
    depends_on:
      - bgutil-provider

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped
